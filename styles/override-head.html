<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("a[href]").forEach(function (link) {
    const href = link.getAttribute("href") || "";
    if (href.startsWith("#")) return;
    // Do not force links to open in a new tab/window; ensure same-tab behavior.
    if (link.hasAttribute("target")) link.removeAttribute("target");
  });

  document
    .querySelectorAll(".sidebar a, .sidebar-navigation a")
    .forEach(function (link) {
      const pattern = /^\s*Day\s+\d+\s*:\s*/i;
      const walker = document.createTreeWalker(link, NodeFilter.SHOW_TEXT);
      let textNode = walker.nextNode();
      while (textNode) {
        textNode.textContent = (textNode.textContent || "").replace(pattern, "");
        textNode = walker.nextNode();
      }
    });
});
</script>
