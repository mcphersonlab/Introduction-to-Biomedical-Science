<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("a[href]").forEach(function (link) {
    const href = link.getAttribute("href") || "";
    if (href.startsWith("#")) return;
    link.setAttribute("target", "_blank");
    const relValues = (link.getAttribute("rel") || "").split(/\s+/).filter(Boolean);
    if (!relValues.includes("noopener")) relValues.push("noopener");
    if (!relValues.includes("noreferrer")) relValues.push("noreferrer");
    link.setAttribute("rel", relValues.join(" "));
  });

  document
    .querySelectorAll(".sidebar a, .sidebar nav a, .sidebar-navigation a")
    .forEach(function (link) {
      const pattern = /^\s*Day\s+\d+\s*:\s*/i;
      let updated = false;

      link.childNodes.forEach(function (node) {
        if (updated || node.nodeType !== Node.TEXT_NODE) return;
        const nextText = (node.textContent || "").replace(pattern, "");
        if (nextText !== node.textContent) {
          node.textContent = nextText;
          updated = true;
        }
      });

      if (!updated && link.children.length === 0) {
        link.textContent = link.textContent.replace(pattern, "");
      }
    });
});
</script>
